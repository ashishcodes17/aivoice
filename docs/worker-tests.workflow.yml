name: voice-worker tests

on:
  push:
    paths: ["voice-worker/**", ".github/workflows/worker-tests.yml"]
  pull_request:
    paths: ["voice-worker/**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      # Each test is a plain script that needs no network and no API keys.
      - run: |
          for t in tests/test_*.py; do
            echo "== $t"
            uv run python "$t"
          done
